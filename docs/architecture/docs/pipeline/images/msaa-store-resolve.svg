<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250" font-family="'SF Mono','Menlo','Consolas',monospace">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0 0 L10 4 L0 8 Z" fill="#4a90d9"/>
    </marker>
    <marker id="arrow-dark" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0 0 L10 4 L0 8 Z" fill="#2c3e50"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="250" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3e50">MSAA — Store vs Resolve</text>

  <!-- ============ LEFT: Store ============ -->
  <text x="100" y="44" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a90d9">STORE</text>

  <!-- Pixel boundary -->
  <rect x="40" y="52" width="120" height="120" rx="2" fill="none" stroke="#2c3e50" stroke-width="1.5"/>

  <!-- 2x2 sub-sample grid -->
  <line x1="100" y1="52" x2="100" y2="172" stroke="#2c3e50" stroke-width="0.8"/>
  <line x1="40" y1="112" x2="160" y2="112" stroke="#2c3e50" stroke-width="0.8"/>

  <!-- 4 sub-samples with slightly different orange/red shades -->
  <rect x="41" y="53" width="58" height="58" rx="1" fill="#e67e22" opacity="0.85"/>
  <rect x="101" y="53" width="58" height="58" rx="1" fill="#d35400" opacity="0.85"/>
  <rect x="41" y="113" width="58" height="58" rx="1" fill="#e74c3c" opacity="0.75"/>
  <rect x="101" y="113" width="58" height="58" rx="1" fill="#c0392b" opacity="0.85"/>

  <!-- Sub-sample labels -->
  <text x="55" y="68" font-size="6" fill="#fff" opacity="0.6">s0</text>
  <text x="115" y="68" font-size="6" fill="#fff" opacity="0.6">s1</text>
  <text x="55" y="128" font-size="6" fill="#fff" opacity="0.6">s2</text>
  <text x="115" y="128" font-size="6" fill="#fff" opacity="0.6">s3</text>

  <!-- Arrow -->
  <line x1="170" y1="112" x2="195" y2="112" stroke="#4a90d9" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="182" y="106" text-anchor="middle" font-size="7" fill="#4a90d9" font-weight="bold">Store</text>

  <!-- 4 samples preserved box -->
  <rect x="205" y="52" width="120" height="120" rx="2" fill="#ecf0f1" stroke="#4a90d9" stroke-width="1.2"/>
  <rect x="207" y="54" width="56" height="56" rx="1" fill="#e67e22" opacity="0.55"/>
  <rect x="267" y="54" width="56" height="56" rx="1" fill="#d35400" opacity="0.55"/>
  <rect x="207" y="114" width="56" height="56" rx="1" fill="#e74c3c" opacity="0.5"/>
  <rect x="267" y="114" width="56" height="56" rx="1" fill="#c0392b" opacity="0.55"/>
  <text x="265" y="130" text-anchor="middle" font-size="7" fill="#7f8c8d">prochaine</text>
  <text x="265" y="140" text-anchor="middle" font-size="7" fill="#7f8c8d">passe</text>

  <text x="100" y="192" text-anchor="middle" font-size="7" fill="#7f8c8d" font-style="italic">Conserve les 4 échantillons</text>
  <text x="100" y="202" text-anchor="middle" font-size="7" fill="#7f8c8d" font-style="italic">pour la passe suivante</text>

  <!-- ============ RIGHT: Resolve ============ -->
  <text x="400" y="44" text-anchor="middle" font-size="11" font-weight="bold" fill="#e67e22">RESOLVE</text>

  <!-- Pixel boundary -->
  <rect x="340" y="52" width="120" height="120" rx="2" fill="none" stroke="#2c3e50" stroke-width="1.5"/>

  <!-- 2x2 sub-sample grid -->
  <line x1="400" y1="52" x2="400" y2="172" stroke="#2c3e50" stroke-width="0.8"/>
  <line x1="340" y1="112" x2="460" y2="112" stroke="#2c3e50" stroke-width="0.8"/>

  <rect x="341" y="53" width="58" height="58" rx="1" fill="#e67e22" opacity="0.85"/>
  <rect x="401" y="53" width="58" height="58" rx="1" fill="#d35400" opacity="0.85"/>
  <rect x="341" y="113" width="58" height="58" rx="1" fill="#e74c3c" opacity="0.75"/>
  <rect x="401" y="113" width="58" height="58" rx="1" fill="#c0392b" opacity="0.85"/>

  <!-- Arrow -->
  <line x1="340" y1="170" x2="340" y2="200" stroke="#e67e22" stroke-width="1.5" marker-end="url(#arrow-dark)"/>
  <text x="328" y="186" text-anchor="end" font-size="7" fill="#e67e22" font-weight="bold">Resolve</text>

  <!-- Averaged pixel below -->
  <rect x="360" y="210" width="80" height="20" rx="3" fill="#e67e22" opacity="0.5" stroke="#e67e22" stroke-width="1.2"/>
  <text x="400" y="224" text-anchor="middle" font-size="8" fill="#2c3e50" font-weight="bold">1 pixel fusionné</text>

  <text x="400" y="192" text-anchor="middle" font-size="7" fill="#7f8c8d" font-style="italic">Fusionne en 1 pixel</text>
  <text x="400" y="202" text-anchor="middle" font-size="7" fill="#7f8c8d" font-style="italic">pour la texture canonique</text>

  <!-- Bottom note -->
  <line x1="10" y1="230" x2="490" y2="230" stroke="#bdc3c7" stroke-width="0.5"/>
  <text x="250" y="244" text-anchor="middle" font-size="7.5" fill="#95a5a6" font-style="italic">Store et Resolve sont indépendants — une passe peut faire l'un, l'autre, ou les deux.</text>
</svg>

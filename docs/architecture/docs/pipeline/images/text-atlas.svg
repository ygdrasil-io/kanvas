<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" font-family="'SF Mono','Menlo','Consolas',monospace">
  <defs>
    <marker id="arrow-cell" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 Z" fill="#4a90d9"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="440" height="300" fill="#f5f7fa"/>

  <!-- Title -->
  <text x="220" y="18" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3e50">Text Glyph Atlas — Principe</text>

  <!-- ============ LEFT: Atlas ============ -->
  <g transform="translate(10, 10)">
    <text x="100" y="18" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a90d9">Atlas de glyphes</text>

    <!-- Atlas texture rectangle -->
    <rect x="10" y="26" width="180" height="180" rx="2" fill="#1a1a2e" stroke="#4a90d9" stroke-width="1.2"/>

    <!-- Faint grid lines -->
    <line x1="55" y1="26" x2="55" y2="206" stroke="#4a90d9" stroke-width="0.4" opacity="0.3"/>
    <line x1="100" y1="26" x2="100" y2="206" stroke="#4a90d9" stroke-width="0.4" opacity="0.3"/>
    <line x1="145" y1="26" x2="145" y2="206" stroke="#4a90d9" stroke-width="0.4" opacity="0.3"/>

    <line x1="10" y1="56" x2="190" y2="56" stroke="#4a90d9" stroke-width="0.4" opacity="0.3"/>
    <line x1="10" y1="86" x2="190" y2="86" stroke="#4a90d9" stroke-width="0.4" opacity="0.3"/>
    <line x1="10" y1="116" x2="190" y2="116" stroke="#4a90d9" stroke-width="0.4" opacity="0.3"/>
    <line x1="10" y1="146" x2="190" y2="146" stroke="#4a90d9" stroke-width="0.4" opacity="0.3"/>
    <line x1="10" y1="176" x2="190" y2="176" stroke="#4a90d9" stroke-width="0.4" opacity="0.3"/>

    <!-- Glyph cells -- row 1 -->
    <text x="32" y="48" text-anchor="middle" font-size="20" fill="#ffffff" font-family="'Georgia','Times New Roman',serif">A</text>
    <text x="77" y="48" text-anchor="middle" font-size="20" fill="#ffffff" font-family="'Georgia','Times New Roman',serif">B</text>
    <text x="122" y="48" text-anchor="middle" font-size="20" fill="#ffffff" font-family="'Georgia','Times New Roman',serif">C</text>
    <text x="167" y="48" text-anchor="middle" font-size="20" fill="#ffffff" font-family="'Georgia','Times New Roman',serif">D</text>

    <!-- Row 2 -->
    <text x="32" y="78" text-anchor="middle" font-size="20" fill="#ffffff" font-family="'Georgia','Times New Roman',serif">E</text>
    <text x="77" y="78" text-anchor="middle" font-size="20" fill="#ffffff" font-family="'Georgia','Times New Roman',serif">F</text>
    <text x="122" y="78" text-anchor="middle" font-size="20" fill="#ffffff" font-family="'Georgia','Times New Roman',serif">g</text>
    <text x="167" y="78" text-anchor="middle" font-size="20" fill="#ffffff" font-family="'Georgia','Times New Roman',serif">h</text>

    <!-- Row 3 -->
    <rect x="10" y="86" width="45" height="30" fill="none"/>
    <rect x="55" y="86" width="45" height="30" fill="none"/>
    <text x="122" y="108" text-anchor="middle" font-size="20" fill="#ffffff" font-family="'Georgia','Times New Roman',serif">p</text>
    <text x="167" y="108" text-anchor="middle" font-size="20" fill="#ffffff" font-family="'Georgia','Times New Roman',serif">r</text>

    <!-- Row 4 -->
    <text x="32" y="138" text-anchor="middle" font-size="20" fill="#ffffff" font-family="'Georgia','Times New Roman',serif">s</text>
    <text x="77" y="138" text-anchor="middle" font-size="20" fill="#ffffff" font-family="'Georgia','Times New Roman',serif">t</text>
    <text x="122" y="138" text-anchor="middle" font-size="20" fill="#ffffff" font-family="'Georgia','Times New Roman',serif">y</text>
    <text x="167" y="138" text-anchor="middle" font-size="20" fill="#ffffff" font-family="'Georgia','Times New Roman',serif">!</text>

    <!-- Highlight the cells used by "graph" -->
    <rect x="10" y="56" width="45" height="30" rx="1" fill="none" stroke="#e67e22" stroke-width="1.5" stroke-dasharray="2,1" opacity="0.7"/>
    <rect x="55" y="86" width="45" height="30" rx="1" fill="none" stroke="#e67e22" stroke-width="1.5" stroke-dasharray="2,1" opacity="0.7"/>
    <rect x="100" y="86" width="45" height="30" rx="1" fill="none" stroke="#e67e22" stroke-width="1.5" stroke-dasharray="2,1" opacity="0.7"/>
    <rect x="145" y="86" width="45" height="30" rx="1" fill="none" stroke="#e67e22" stroke-width="1.5" stroke-dasharray="2,1" opacity="0.7"/>
    <rect x="100" y="116" width="45" height="30" rx="1" fill="none" stroke="#e67e22" stroke-width="1.5" stroke-dasharray="2,1" opacity="0.7"/>
  </g>

  <!-- ============ RIGHT: Draw ============ -->
  <g transform="translate(230, 10)">
    <text x="100" y="18" text-anchor="middle" font-size="10" font-weight="bold" fill="#e67e22">Draw</text>

    <!-- Render area -->
    <rect x="10" y="26" width="180" height="180" rx="2" fill="#1a1a2e" stroke="#e67e22" stroke-width="1.2"/>

    <!-- The word "graph" rendered -->
    <text x="28" y="145" font-size="42" fill="#ffffff" font-family="'Georgia','Times New Roman',serif" font-weight="normal">graph</text>

    <!-- Individual letter positioning markers -->
    <!-- g -->
    <rect x="22" y="100" width="26" height="52" rx="1" fill="none" stroke="#e67e22" stroke-width="0.8" stroke-dasharray="2,1"/>
    <!-- r -->
    <rect x="52" y="100" width="18" height="52" rx="1" fill="none" stroke="#e67e22" stroke-width="0.8" stroke-dasharray="2,1"/>
    <!-- a -->
    <rect x="74" y="100" width="22" height="52" rx="1" fill="none" stroke="#e67e22" stroke-width="0.8" stroke-dasharray="2,1"/>
    <!-- p -->
    <rect x="100" y="100" width="22" height="52" rx="1" fill="none" stroke="#e67e22" stroke-width="0.8" stroke-dasharray="2,1"/>
    <!-- h -->
    <rect x="126" y="100" width="22" height="52" rx="1" fill="none" stroke="#e67e22" stroke-width="0.8" stroke-dasharray="2,1"/>
  </g>

  <!-- ============ Arrows: atlas cell → render ============ -->
  <!-- g cell → g letter: cell at (65, 96) to render at (250, 110) -->
  <path d="M 120 96 Q 180 60 250 110" fill="none" stroke="#e67e22" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrow-cell)" opacity="0.5"/>
  <!-- h cell → h letter: cell at (210, 96) to render at (355, 110) -->
  <path d="M 210 96 Q 260 60 355 110" fill="none" stroke="#e67e22" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrow-cell)" opacity="0.5"/>

  <!-- ============ Bottom labels ============ -->
  <g transform="translate(0, 228)">
    <line x1="10" y1="8" x2="430" y2="8" stroke="#bdc3c7" stroke-width="0.5"/>
    <text x="12" y="26" font-size="8" fill="#7f8c8d">
      <tspan font-weight="bold" fill="#4a90d9">1.</tspan>
      <tspan> Rasterisation CPU → atlas de glyphes (</tspan>
      <tspan font-weight="bold" fill="#4a90d9">texture A8</tspan>
      <tspan>)</tspan>
    </text>
    <text x="12" y="44" font-size="8" fill="#7f8c8d">
      <tspan font-weight="bold" fill="#e67e22">2.</tspan>
      <tspan> Upload GPU → shader sample la région du glyphe</tspan>
    </text>
  </g>
</svg>

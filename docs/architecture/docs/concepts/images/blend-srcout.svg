<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160">
  <defs>
    <pattern id="checker" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#eee"/>
      <rect x="4" width="4" height="4" fill="#ddd"/>
      <rect y="4" width="4" height="4" fill="#ddd"/>
      <rect x="4" y="4" width="4" height="4" fill="#eee"/>
    </pattern>
    <mask id="srcOut">
      <rect width="240" height="160" fill="white"/>
      <rect x="20" y="20" width="160" height="110" rx="6" fill="black"/>
    </mask>
  </defs>
  <rect width="240" height="160" fill="url(#checker)"/>
  <rect x="20" y="20" width="160" height="110" rx="6" fill="none" stroke="#4472C4" stroke-width="1" stroke-dasharray="4,3" opacity="0.35"/>
  <circle cx="150" cy="75" r="40" fill="#ED7D31" mask="url(#srcOut)"/>
  <circle cx="150" cy="75" r="40" fill="none" stroke="#ED7D31" stroke-width="1" stroke-dasharray="4,3" opacity="0.3"/>
  <text x="120" y="155" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#888">SrcOut</text>
</svg>

  <rect x="20" y="20" width="160" height="110" rx="6" fill="#4472C4" clip-path="url(#srcCircle)"/>
  <text x="120" y="155" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#888">DstIn</text>

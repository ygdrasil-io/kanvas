<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="600" height="200" fill="#2d2d2d"/>

  <!-- Frame 1: Zone affectée -->
  <rect x="10" y="15" width="92" height="90" fill="#4472C4" rx="4" opacity="0.9"/>
  <rect x="30" y="35" width="55" height="50" fill="#ED7D31" rx="2" opacity="0.85"/>
  <text x="56" y="118" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#aaa">1. Zone</text>
  <text x="56" y="129" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#aaa">affectée</text>

  <!-- Arrow 1→2 -->
  <line x1="107" y1="60" x2="133" y2="60" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Frame 2: Bornes expansées -->
  <rect x="140" y="15" width="92" height="90" fill="#4472C4" rx="4" opacity="0.9"/>
  <rect x="28" y="33" width="59" height="54" fill="#ED7D31" rx="2" opacity="0.85"
        transform="translate(112,0)"/>
  <rect x="25" y="30" width="65" height="60" fill="none" stroke="#ED7D31" stroke-width="1.5"
        stroke-dasharray="3,2" rx="2" transform="translate(112,0)" opacity="0.5"/>
  <text x="186" y="118" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#aaa">2. Expansion</text>
  <text x="186" y="129" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#aaa">AA/filtre</text>

  <!-- Arrow 2→3 -->
  <line x1="237" y1="60" x2="263" y2="60" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Frame 3: Intersection -->
  <rect x="270" y="15" width="92" height="90" fill="#4472C4" rx="4" opacity="0.9"/>
  <clipPath id="clip3">
    <rect x="270" y="15" width="92" height="90" rx="4"/>
  </clipPath>
  <rect x="300" y="33" width="59" height="54" fill="#ED7D31" rx="2" opacity="0.85" clip-path="url(#clip3)"/>
  <!-- Dimmed part outside -->
  <g clip-path="url(#clip3)">
    <rect x="300" y="33" width="59" height="54" fill="#ED7D31" rx="2" opacity="0.25"/>
    <rect x="300" y="33" width="59" height="54" fill="rgba(0,0,0,0.4)" rx="2"/>
  </g>
  <text x="316" y="118" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#aaa">3. Intersection</text>
  <text x="316" y="129" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#aaa">bornes cible</text>

  <!-- Arrow 3→4 -->
  <line x1="367" y1="60" x2="393" y2="60" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Frame 4: Copie -->
  <rect x="400" y="15" width="92" height="90" fill="#4472C4" rx="4" opacity="0.9"/>
  <rect x="420" y="35" width="52" height="50" fill="#ED7D31" rx="2" opacity="0.85"/>
  <!-- Arrow from region to separate texture -->
  <path d="M472,55 Q495,50 505,60" fill="none" stroke="#ED7D31" stroke-width="1.5"
        stroke-dasharray="3,2" marker-end="url(#arrow)"/>
  <!-- Separate small texture -->
  <rect x="505" y="55" width="28" height="20" fill="#ED7D31" rx="2" opacity="0.85"/>
  <text x="446" y="118" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#aaa">4. Copie GPU →</text>
  <text x="446" y="129" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#aaa">texture temp.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160">
  <defs>
    <pattern id="checker" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#eee"/>
      <rect x="4" width="4" height="4" fill="#ddd"/>
      <rect y="4" width="4" height="4" fill="#ddd"/>
      <rect x="4" y="4" width="4" height="4" fill="#eee"/>
    </pattern>
    <clipPath id="dstRect">
      <rect x="20" y="20" width="160" height="110" rx="6"/>
    </clipPath>
    <clipPath id="srcCircle">
      <circle cx="150" cy="75" r="40"/>
    </clipPath>
    <mask id="rectOnly">
      <rect width="240" height="160" fill="white"/>
      <circle cx="150" cy="75" r="40" fill="black" clip-path="url(#dstRect)"/>
    </mask>
    <mask id="circleOnly">
      <rect width="240" height="160" fill="white"/>
      <rect x="20" y="20" width="160" height="110" rx="6" fill="black" clip-path="url(#srcCircle)"/>
    </mask>
  </defs>
  <rect width="240" height="160" fill="url(#checker)"/>
  <rect x="20" y="20" width="160" height="110" rx="6" fill="#4472C4" mask="url(#rectOnly)"/>
  <circle cx="150" cy="75" r="40" fill="#ED7D31" mask="url(#circleOnly)"/>
  <text x="120" y="155" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#888">Xor</text>
</svg>
